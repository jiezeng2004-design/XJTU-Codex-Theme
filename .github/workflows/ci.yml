name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Node 22
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate theme manifests and assets
        run: node .\scripts\check-theme-assets.mjs

      - name: Run engine unit tests
        run: npm.cmd test --prefix engine

      - name: Run PowerShell safety tests
        shell: powershell
        run: .\scripts\test-theme-safety.ps1

      - name: Run offline hot-engine DryRun
        shell: powershell
        run: .\scripts\test-hot-theme-engine.ps1 -Offline
