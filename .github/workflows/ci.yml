name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Node 22
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate theme manifests and assets
        run: node .\scripts\check-theme-assets.mjs

      - name: Validate Skill packages
        run: node .\scripts\check-skill-pack.mjs

      - name: Validate immutable Skin Maker workspace release
        run: node .\scripts\check-skin-maker-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Parse Skill PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem .\skills\codex-skin-maker\scripts\*.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
          }

      - name: Test Codex Skin Maker safety gates
        shell: powershell
        run: .\scripts\test-skin-maker-safety.ps1

      - name: Run engine unit tests
        run: npm.cmd test --prefix engine

      - name: Run PowerShell safety tests
        shell: powershell
        run: .\scripts\test-theme-safety.ps1

      - name: Run offline hot-engine DryRun
        shell: powershell
        run: .\scripts\test-hot-theme-engine.ps1 -Offline
