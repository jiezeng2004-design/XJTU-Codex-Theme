<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title desc">
  <title id="title">XJTU Codex light campus concept</title>
  <desc id="desc">Original abstract campus architecture with Xi'an historic and modern research motifs, composed on the right with calm space on the left.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f2"/>
      <stop offset="0.56" stop-color="#eef3f5"/>
      <stop offset="1" stop-color="#dce8ed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7e8ef" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#9db9c8" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eee4"/>
      <stop offset="1" stop-color="#c8d3d5"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe5e5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b8c9c9" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 8h16M8 0v16" stroke="#204a70" stroke-opacity="0.018" stroke-width="1"/>
    </pattern>
    <pattern id="windows" width="52" height="42" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="26" height="15" rx="2" fill="#f6faf9" fill-opacity="0.74"/>
      <path d="M0 34h52" stroke="#214b6b" stroke-opacity="0.14"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#sky)"/>
  <rect width="2560" height="1440" fill="url(#paper)"/>

